[project]
name = "polyclaude"
version = "0.4.0"
description = "The entry point to Claude Code — pick any directory, resume any session."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sergei Patrikeev" }]
keywords = ["claude", "cli", "tui", "session-manager"]
classifiers = [
    "Environment :: Console :: Curses",
    "Topic :: Utilities",
]

[project.scripts]
polyclaude = "polyclaude.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyclaude"]
